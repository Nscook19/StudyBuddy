[project]
name = "study-buddy-backend"
version = "0.1.0"
description = "Study Buddy flashcard API"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "PyJWT[crypto]>=2.10,<3",
    "pypdf>=5,<7",
    "python-multipart>=0.0.9,<1",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
