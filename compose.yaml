# Local development only; AWS deployment is a later milestone.
services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    networks:
      - appnet

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev"
    environment:
      API_PROXY_TARGET: http://backend:8080
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - appnet

networks:
  appnet:

volumes:
  frontend_node_modules:
