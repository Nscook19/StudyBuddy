# Milestone 2: React -> FastAPI -> private llama.cpp LLM.
services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      LLM_URL: http://llm:8000
      MODEL_NAME: qwen3-1.7b
    depends_on:
      llm:
        condition: service_healthy
    networks:
      - appnet

  llm:
    build: ./llm
    # No host ports: only the backend reaches the model over appnet.
    networks:
      - appnet

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev"
    environment:
      API_PROXY_TARGET: http://backend:8080
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - appnet

networks:
  appnet:

volumes:
  frontend_node_modules:
